version: "3.7"

services:
  smoldb-0:
    image: kshivendu/smoldb:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__CLUSTER__ENABLED=true
      - QDRANT__CLUSTER__RESHARDING_ENABLED=true
      - QDRANT__CLUSTER__P2P__PORT=6335
    ports:
      - "9000:9000"
      - "9910:9910"
    entrypoint: []
    command: ./smoldb --url 'smoldb-0:9000'

  smoldb-1:
    image: kshivendu/smoldb:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__CLUSTER__ENABLED=true
      - QDRANT__CLUSTER__RESHARDING_ENABLED=true
      - QDRANT__CLUSTER__P2P__PORT=6335
    depends_on:
      - smoldb-0
    ports:
      - "9901:9000"
      - "9911:9910"
    entrypoint: []
    command: bash -c "sleep 5 && ./smoldb --bootstrap 'smoldb-0:9000' --url 'smoldb-1:9000'"

  smoldb-2:
    image: kshivendu/smoldb:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__CLUSTER__ENABLED=true
      - QDRANT__CLUSTER__RESHARDING_ENABLED=true
      - QDRANT__CLUSTER__P2P__PORT=6335
    depends_on:
      - smoldb-0
    ports:
      - "9902:9000"
      - "9912:9910"
    entrypoint: []
    command: bash -c "sleep 6 && ./smoldb --bootstrap 'smoldb-0:9000' --url 'smoldb-2:9000'"
