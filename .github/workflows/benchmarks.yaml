name: "Benchmarks"
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ '**' ]

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for baseline comparisons

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2

      - name: Install jq and bc
        run: sudo apt-get update && sudo apt-get install -y jq bc

      # Determine baseline SHA based on event type
      - name: Determine baseline commit
        id: baseline
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # For PRs: compare against the base branch
            BASELINE_SHA="${{ github.event.pull_request.base.sha }}"
            echo "sha=$BASELINE_SHA" >> $GITHUB_OUTPUT
            echo "📌 PR: Using base commit $BASELINE_SHA as baseline"
          elif [ "${{ github.event_name }}" == "push" ]; then
            # For pushes: compare against previous commit (if exists)
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              BASELINE_SHA=$(git rev-parse HEAD^)
              echo "sha=$BASELINE_SHA" >> $GITHUB_OUTPUT
              echo "📌 Push: Using previous commit $BASELINE_SHA as baseline"
            else
              echo "sha=" >> $GITHUB_OUTPUT
              echo "📌 Push: No previous commit (first commit on branch)"
            fi
          fi

      - name: Run benchmarks
        id: bench_results
        continue-on-error: true
        uses: ./.github/actions/run-benchmarks
        with:
          bench_name: collection
          baseline_sha: ${{ steps.baseline.outputs.sha }}
          current_sha: ${{ github.sha }}

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: target/criterion
          retention-days: 7

      - name: Parse benchmark results
        if: always()
        uses: ./.github/actions/parse-benchmark-results
        with:
          baseline_exists: ${{ steps.bench_results.outputs.baseline_exists }}
          baseline_sha: ${{ steps.baseline.outputs.sha }}

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: benchmark_summary.md
          edit-mode: replace
