name: "Benchmarks"
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ '**' ]


jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # We need full history to be able to checkout the base commit / previous commit
          fetch-depth: 0
      - name: Install Protoc # for protobuf
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Install jq and bc
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc
      - name: Run benchmarks with baseline comparison
        # For PRs: compare against the base branch commit
        # For pushes: compare against the previous commit on the same branch
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: bench_results
        continue-on-error: true
        uses: ./.github/actions/run-benchmarks
        with:
          bench_name: collection
          baseline_name: main
          event_name: ${{ github.event_name }}
          base_sha: ${{ github.event.pull_request.base.sha }}
          current_sha: ${{ github.sha }}
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: target/criterion
          retention-days: 7
      - name: Parse and report benchmark results
        if: always()
        id: parse_results
        uses: ./.github/actions/parse-benchmark-results
        with:
          event_name: ${{ github.event_name }}
          baseline_exists: ${{ steps.bench_results.outputs.baseline_exists }}
          base_sha: ${{ github.event.pull_request.base.sha }}
          exit_code: ${{ steps.bench_results.outputs.exit_code }}
      - name: Post benchmark results as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: benchmark_summary.md
          edit-mode: replace
