name: "Benchmarks"
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ '**' ]


jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # We need full history to be able to checkout the base commit / previous commit
          fetch-depth: 0
      - name: Install Protoc # for protobuf
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Install jq and bc
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc
      - name: Run benchmarks with baseline comparison
        # For PRs: compare against the base branch commit
        # For pushes: compare against the previous commit on the same branch
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: bench_results
        continue-on-error: true
        run: |
          # Background monitor loop (prints every 3s)
          monitor() {
            CPU_CORES=$(nproc)
            while true; do
              MEM_USED=$(free -m | awk '/^Mem:/ {printf "%.1f", $3/1024}')
              MEM_TOTAL=$(free -m | awk '/^Mem:/ {printf "%.1f", $2/1024}')
              DISK_USED=$(df $PWD | awk 'NR==2 {printf "%.1f", $3/1024}')
              DISK_TOTAL=$(df $PWD | awk 'NR==2 {printf "%.1f", $2/1024}')
              CPU_PCT=$(mpstat 1 1 | awk 'END {printf "%.0f", 100-$NF}')
              echo "memory: ${MEM_USED}GB / ${MEM_TOTAL}GB | disk: ${DISK_USED}GB / ${DISK_TOTAL}GB | cpu: ${CPU_PCT}% (${CPU_CORES} cores)"
              sleep 5
            done
          }
          monitor &
          MONITOR_PID=$!

          # Ensure target/criterion directory exists
          mkdir -p target/criterion

          echo "event_name=${{ github.event_name }}"

          BASELINE_EXISTS=false

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "📌 PR detected. Using base commit as baseline..."
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            PR_SHA="${{ github.sha }}"

            if [ -n "$BASE_SHA" ]; then
              echo "Checking out base commit $BASE_SHA to generate baseline..."
              git checkout "$BASE_SHA"
              cargo bench --bench collection -- --save-baseline main || true

              echo "Switching back to PR commit $PR_SHA..."
              git checkout "$PR_SHA"
              BASELINE_EXISTS=true
            else
              echo "⚠️ Could not determine base SHA, running without baseline."
            fi
          elif [ "${{ github.event_name }}" == "push" ]; then
            echo "📌 Push detected. Using previous commit as baseline (if it exists)..."
            CURRENT_SHA="${{ github.sha }}"

            if git rev-parse HEAD^ >/dev/null 2>&1; then
              PREV_SHA=$(git rev-parse HEAD^)
              echo "Previous commit detected: $PREV_SHA. Generating baseline from it..."
              git checkout "$PREV_SHA"
              cargo bench --bench collection -- --save-baseline main || true

              echo "Switching back to current commit $CURRENT_SHA..."
              git checkout "$CURRENT_SHA"
              BASELINE_EXISTS=true
            else
              echo "⚠️ No previous commit found (first commit on branch). Running without baseline."
            fi
          fi

          if [ "$BASELINE_EXISTS" = "false" ]; then
            echo "⚠️ No baseline available. Running benchmarks and saving baseline for future runs..."
            cargo bench --bench collection -- --save-baseline main 2>&1 | tee bench_output.txt || true
            echo "baseline_missing=true" >> $GITHUB_OUTPUT
            echo "exit_code=0" >> $GITHUB_OUTPUT
          else
            echo "📊 Running benchmarks with baseline comparison..."
            # Run with baseline comparison - Criterion will show differences
            cargo bench --bench collection -- --baseline main 2>&1 | tee bench_output.txt || true
            BENCH_EXIT_CODE=${PIPESTATUS[0]}
            echo "exit_code=$BENCH_EXIT_CODE" >> $GITHUB_OUTPUT
            echo "baseline_missing=false" >> $GITHUB_OUTPUT

            # Also run with --test to get threshold checking (fails on significant regressions)
            echo "" >> bench_output.txt
            echo "=== Threshold Check (5% significance) ===" >> bench_output.txt
            cargo bench --bench collection -- --baseline main --test 2>&1 | tee -a bench_output.txt || true
          fi

          # Kill monitor
          kill $MONITOR_PID || true
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: target/criterion
          retention-days: 7
      - name: Parse and report benchmark results
        if: always()
        run: |
          echo "## 📊 Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            if [ "${{ steps.bench_results.outputs.baseline_missing }}" == "true" ]; then
              echo "⚠️ **No baseline found for comparison.** This might be the first benchmark-capable commit for this PR or its base." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            elif [ -f bench_output.txt ]; then
              # Check for performance regressions
              if grep -qi "regressed\|regression\|slower" bench_output.txt; then
                echo "❌ **Performance regression detected!**" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
              elif [ "${{ steps.bench_results.outputs.exit_code }}" == "0" ]; then
                echo "✅ **All benchmarks passed threshold checks**" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          fi

          # For PRs with a baseline, build a structured comparison table using Criterion JSON
          if [ -d target/criterion ] && [ "${{ github.event_name }}" == "pull_request" ] && [ "${{ steps.bench_results.outputs.baseline_missing }}" != "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Baseline Comparison against $BASE_SHA" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Benchmark | Baseline Mean | Current Mean | Change | Significant (≥5%) | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|---------------|--------------|--------|--------------------|--------|" >> $GITHUB_STEP_SUMMARY

            # Get list of all benchmarks we know about
            ALL_BENCHES_BASE=""
            ALL_BENCHES_CURRENT=""

            # Find all benchmarks in baseline
            if [ -d target/criterion ]; then
              ALL_BENCHES_BASE=$(find target/criterion -name "estimates.json" -path "*/main/*" 2>/dev/null | sed -n 's|.*/\([^/]*\)/[^/]*/main/estimates.json|\1|p' | sort -u || true)
              ALL_BENCHES_CURRENT=$(find target/criterion -name "estimates.json" -path "*/new/*" 2>/dev/null | sed -n 's|.*/\([^/]*\)/[^/]*/new/estimates.json|\1|p' | sort -u || true)
            fi

            # Get panicked benchmarks if available
            PANICKED_BENCHES_COMP=""
            if [ -f bench_output.txt ]; then
              BENCHES_STARTED=$(grep "^Benchmarking " bench_output.txt | sed 's/^Benchmarking //' | sort -u || true)
              if [ -n "$BENCHES_STARTED" ] && [ -n "$ALL_BENCHES_CURRENT" ]; then
                PANICKED_BENCHES_COMP=$(comm -23 <(echo "$BENCHES_STARTED") <(echo "$ALL_BENCHES_CURRENT") 2>/dev/null || true)
              elif [ -n "$BENCHES_STARTED" ] && [ -z "$ALL_BENCHES_CURRENT" ]; then
                PANICKED_BENCHES_COMP="$BENCHES_STARTED"
              fi
            fi

            # Combine all benchmarks (baseline + current + panicked)
            ALL_BENCHES_COMP=$(printf "%s\n%s\n%s" "$ALL_BENCHES_BASE" "$ALL_BENCHES_CURRENT" "$PANICKED_BENCHES_COMP" | sort -u | grep -v '^$' || true)

            # Process each benchmark
            if [ -n "$ALL_BENCHES_COMP" ]; then
              echo "$ALL_BENCHES_COMP" | while read bench_name; do
                new_file=$(find target/criterion -name "estimates.json" -path "*/${bench_name}/new/*" 2>/dev/null | head -1 || true)
                base_file=$(find target/criterion -name "estimates.json" -path "*/${bench_name}/main/*" 2>/dev/null | head -1 || true)

                # Check if panicked
                IS_PANICKED=false
                if [ -n "$PANICKED_BENCHES_COMP" ] && echo "$PANICKED_BENCHES_COMP" | grep -q "^${bench_name}$"; then
                  IS_PANICKED=true
                fi

                # Check if new benchmark
                IS_NEW=false
                if [ -z "$base_file" ] && [ -n "$new_file" ]; then
                  IS_NEW=true
                fi

                if [ "$IS_PANICKED" = "true" ]; then
                  # Panicked benchmark
                  base_mean_disp="—"
                  new_mean_disp="—"
                  signed_change="—"
                  significant="—"
                  status="❌ PANICKED"
                elif [ "$IS_NEW" = "true" ] && [ -n "$new_file" ]; then
                  # New benchmark (only in current run)
                  base_mean_disp="—"
                  new_mean_ns=$(jq -r '.mean.point_estimate' "$new_file" 2>/dev/null)

                  if [ "$new_mean_ns" != "null" ] && [ -n "$new_mean_ns" ] && [ "$new_mean_ns" != "" ]; then
                    if (( $(echo "$new_mean_ns > 1000000" | bc -l) )); then
                      new_mean_ms=$(echo "scale=2; $new_mean_ns / 1000000" | bc)
                      new_mean_disp="${new_mean_ms} ms"
                    elif (( $(echo "$new_mean_ns > 1000" | bc -l) )); then
                      new_mean_us=$(echo "scale=2; $new_mean_ns / 1000" | bc)
                      new_mean_disp="${new_mean_us} µs"
                    else
                      new_mean_disp="${new_mean_ns} ns"
                    fi
                  else
                    new_mean_disp="—"
                  fi

                  signed_change="—"
                  significant="—"
                  status="🆕 NEW"
                elif [ -n "$new_file" ] && [ -n "$base_file" ]; then
                  # Both exist - normal comparison
                  new_mean_ns=$(jq -r '.mean.point_estimate' "$new_file" 2>/dev/null)
                  base_mean_ns=$(jq -r '.mean.point_estimate' "$base_file" 2>/dev/null)

                  if [ "$new_mean_ns" = "null" ] || [ -z "$new_mean_ns" ] || [ "$base_mean_ns" = "null" ] || [ -z "$base_mean_ns" ]; then
                    continue
                  fi

                  # Format baseline mean into human-friendly units
                  if (( $(echo "$base_mean_ns > 1000000" | bc -l) )); then
                    base_mean_ms=$(echo "scale=2; $base_mean_ns / 1000000" | bc)
                    base_mean_disp="${base_mean_ms} ms"
                  elif (( $(echo "$base_mean_ns > 1000" | bc -l) )); then
                    base_mean_us=$(echo "scale=2; $base_mean_ns / 1000" | bc)
                    base_mean_disp="${base_mean_us} µs"
                  else
                    base_mean_disp="${base_mean_ns} ns"
                  fi

                  # Format current mean into human-friendly units
                  if (( $(echo "$new_mean_ns > 1000000" | bc -l) )); then
                    new_mean_ms=$(echo "scale=2; $new_mean_ns / 1000000" | bc)
                    new_mean_disp="${new_mean_ms} ms"
                  elif (( $(echo "$new_mean_ns > 1000" | bc -l) )); then
                    new_mean_us=$(echo "scale=2; $new_mean_ns / 1000" | bc)
                    new_mean_disp="${new_mean_us} µs"
                  else
                    new_mean_disp="${new_mean_ns} ns"
                  fi

                  change_pct=$(echo "scale=2; ($new_mean_ns - $base_mean_ns) * 100 / $base_mean_ns" | bc -l)

                  # Ensure a sign is always shown
                  if echo "$change_pct" | grep -q '^-'; then
                    signed_change="${change_pct}%"
                  else
                    signed_change="+${change_pct}%"
                  fi

                  # Heuristic "significance": highlight changes with magnitude ≥ 5%
                  abs_change_pct=$(echo "if ($change_pct < 0) -$change_pct else $change_pct" | bc -l)
                  if (( $(echo "$abs_change_pct >= 5.0" | bc -l) )); then
                    significant="yes"
                  else
                    significant="no"
                  fi

                  status="✅"
                elif [ -n "$base_file" ] && [ -z "$new_file" ]; then
                  # Exists in baseline but not in current (likely panicked or removed)
                  base_mean_ns=$(jq -r '.mean.point_estimate' "$base_file" 2>/dev/null)

                  if [ "$base_mean_ns" != "null" ] && [ -n "$base_mean_ns" ] && [ "$base_mean_ns" != "" ]; then
                    if (( $(echo "$base_mean_ns > 1000000" | bc -l) )); then
                      base_mean_ms=$(echo "scale=2; $base_mean_ns / 1000000" | bc)
                      base_mean_disp="${base_mean_ms} ms"
                    elif (( $(echo "$base_mean_ns > 1000" | bc -l) )); then
                      base_mean_us=$(echo "scale=2; $base_mean_ns / 1000" | bc)
                      base_mean_disp="${base_mean_us} µs"
                    else
                      base_mean_disp="${base_mean_ns} ns"
                    fi
                  else
                    base_mean_disp="—"
                  fi

                  new_mean_disp="—"
                  signed_change="—"
                  significant="—"
                  status="⚠️ MISSING"
                else
                  # Skip if we can't determine anything
                  continue
                fi

                echo "| $bench_name | $base_mean_disp | $new_mean_disp | $signed_change | $significant | $status |" >> $GITHUB_STEP_SUMMARY
              done
            fi
          fi

          # Extract JSON results for summary table
          if [ -d target/criterion ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Benchmark Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # For PRs, we need to track which benchmarks panicked and which are new
            if [ "${{ github.event_name }}" == "pull_request" ] && [ -f bench_output.txt ]; then
              # Extract benchmark names that panicked from the output
              # Criterion outputs "Benchmarking <name>" before each benchmark
              # Panics show up as "panicked at" or "thread '<name>' panicked"
              PANICKED_BENCHES=$(grep -E "thread '[^']*' panicked|panicked at" bench_output.txt | grep -oE "thread '[^']*'" | sed "s/thread '//;s/'//" | sort -u || true)

              # Also try to extract from "Benchmarking <name>" lines that are followed by panics
              # This is a more reliable way - find benchmarks that were started but never completed
              BENCHES_STARTED=$(grep "^Benchmarking " bench_output.txt | sed 's/^Benchmarking //' | sort -u || true)

              # Find benchmarks that completed successfully (have new/ directory)
              BENCHES_COMPLETED=$(find target/criterion -name "estimates.json" -path "*/new/*" 2>/dev/null | sed -n 's|.*/\([^/]*\)/[^/]*/estimates.json|\1|p' | sort -u || true)

              # Benchmarks that started but didn't complete are likely panicked
              # Use a more robust method that handles empty inputs
              if [ -n "$BENCHES_STARTED" ] && [ -n "$BENCHES_COMPLETED" ]; then
                PANICKED_FROM_COMPARISON=$(comm -23 <(echo "$BENCHES_STARTED") <(echo "$BENCHES_COMPLETED") 2>/dev/null || true)
                if [ -n "$PANICKED_FROM_COMPARISON" ]; then
                  PANICKED_BENCHES=$(printf "%s\n%s" "$PANICKED_BENCHES" "$PANICKED_FROM_COMPARISON" | sort -u | grep -v '^$' || true)
                fi
              elif [ -n "$BENCHES_STARTED" ] && [ -z "$BENCHES_COMPLETED" ]; then
                # If no benchmarks completed but some started, they all likely panicked
                PANICKED_BENCHES=$(printf "%s\n%s" "$PANICKED_BENCHES" "$BENCHES_STARTED" | sort -u | grep -v '^$' || true)
              fi
            else
              PANICKED_BENCHES=""
            fi

            # Determine which benchmarks exist in baseline (for detecting new benchmarks)
            BASELINE_BENCHES=""
            if [ "${{ github.event_name }}" == "pull_request" ] && [ -d target/criterion ]; then
              BASELINE_BENCHES=$(find target/criterion -name "estimates.json" -path "*/main/*" 2>/dev/null | sed -n 's|.*/\([^/]*\)/[^/]*/estimates.json|\1|p' | sort -u || true)
            fi

            # Determine which benchmarks exist in current run
            CURRENT_BENCHES=""
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              CURRENT_BENCHES=$(find target/criterion -name "estimates.json" -path "*/new/*" 2>/dev/null | sed -n 's|.*/\([^/]*\)/[^/]*/estimates.json|\1|p' | sort -u || true)
            else
              CURRENT_BENCHES=$(find target/criterion -name "estimates.json" -path "*/main/*" 2>/dev/null | sed -n 's|.*/\([^/]*\)/[^/]*/estimates.json|\1|p' | sort -u || true)
            fi

            # Combine all benchmarks we know about (baseline + current + panicked)
            ALL_BENCHES=$(printf "%s\n%s\n%s" "$BASELINE_BENCHES" "$CURRENT_BENCHES" "$PANICKED_BENCHES" | sort -u | grep -v '^$' || true)

            echo "| Benchmark | Status | Mean Time |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|--------|-----------|" >> $GITHUB_STEP_SUMMARY

            # Process each benchmark we know about
            if [ -n "$ALL_BENCHES" ]; then
              echo "$ALL_BENCHES" | while read BENCH_NAME; do
                # Check if this benchmark panicked
                IS_PANICKED=false
                if [ -n "$PANICKED_BENCHES" ] && echo "$PANICKED_BENCHES" | grep -q "^${BENCH_NAME}$"; then
                  IS_PANICKED=true
                fi

                # Check if this is a new benchmark (not in baseline)
                IS_NEW=false
                if [ "${{ github.event_name }}" == "pull_request" ] && [ -n "$BASELINE_BENCHES" ]; then
                  if ! echo "$BASELINE_BENCHES" | grep -q "^${BENCH_NAME}$"; then
                    IS_NEW=true
                  fi
                fi

                # Try to find the estimates.json file
                ESTIMATES_FILE=""
                if [ "${{ github.event_name }}" == "pull_request" ]; then
                  ESTIMATES_FILE=$(find target/criterion -name "estimates.json" -path "*/${BENCH_NAME}/new/*" 2>/dev/null | head -1 || true)
                  # If not found in new/, check main/ (but only if not panicked)
                  if [ -z "$ESTIMATES_FILE" ] && [ "$IS_PANICKED" = "false" ]; then
                    ESTIMATES_FILE=$(find target/criterion -name "estimates.json" -path "*/${BENCH_NAME}/main/*" 2>/dev/null | head -1 || true)
                  fi
                else
                  ESTIMATES_FILE=$(find target/criterion -name "estimates.json" -path "*/${BENCH_NAME}/main/*" 2>/dev/null | head -1 || true)
                fi

                # Determine status and time
                STATUS=""
                TIME_DISPLAY=""

                if [ "$IS_PANICKED" = "true" ]; then
                  STATUS="❌ PANICKED"
                  TIME_DISPLAY="—"
                elif [ -n "$ESTIMATES_FILE" ] && [ -f "$ESTIMATES_FILE" ]; then
                  MEAN_NS=$(jq -r '.mean.point_estimate' "$ESTIMATES_FILE" 2>/dev/null || echo "null")

                  if [ "$MEAN_NS" != "null" ] && [ -n "$MEAN_NS" ] && [ "$MEAN_NS" != "" ]; then
                    if [ "$IS_NEW" = "true" ]; then
                      STATUS="🆕 NEW"
                    else
                      STATUS="✅ OK"
                    fi

                    # Convert to appropriate unit
                    if (( $(echo "$MEAN_NS > 1000000" | bc -l 2>/dev/null || echo "0") )); then
                      MEAN_MS=$(echo "scale=2; $MEAN_NS / 1000000" | bc)
                      TIME_DISPLAY="${MEAN_MS} ms"
                    elif (( $(echo "$MEAN_NS > 1000" | bc -l 2>/dev/null || echo "0") )); then
                      MEAN_US=$(echo "scale=2; $MEAN_NS / 1000" | bc)
                      TIME_DISPLAY="${MEAN_US} µs"
                    else
                      TIME_DISPLAY="${MEAN_NS} ns"
                    fi
                  else
                    STATUS="⚠️ NO DATA"
                    TIME_DISPLAY="—"
                  fi
                elif [ "$IS_NEW" = "true" ]; then
                  STATUS="🆕 NEW (no data)"
                  TIME_DISPLAY="—"
                else
                  STATUS="⚠️ MISSING"
                  TIME_DISPLAY="—"
                fi

                echo "| $BENCH_NAME | $STATUS | $TIME_DISPLAY |" >> $GITHUB_STEP_SUMMARY
              done
            else
              # Fallback: if we can't determine benchmarks, use the old method
              ESTIMATES_PATH="*/main/*"
              if [ "${{ github.event_name }}" == "pull_request" ]; then
                ESTIMATES_PATH="*/new/*"
              fi

              find target/criterion -name "estimates.json" -path "$ESTIMATES_PATH" 2>/dev/null | sort | while read file; do
                BENCH_NAME=$(echo "$file" | sed -n 's|.*/\([^/]*\)/[^/]*/estimates.json|\1|p')
                MEAN_NS=$(jq -r '.mean.point_estimate' "$file" 2>/dev/null)

                if [ "$MEAN_NS" != "null" ] && [ -n "$MEAN_NS" ] && [ "$MEAN_NS" != "" ]; then
                  if (( $(echo "$MEAN_NS > 1000000" | bc -l) )); then
                    MEAN_MS=$(echo "scale=2; $MEAN_NS / 1000000" | bc)
                    echo "| $BENCH_NAME | ✅ OK | ${MEAN_MS} ms |" >> $GITHUB_STEP_SUMMARY
                  elif (( $(echo "$MEAN_NS > 1000" | bc -l) )); then
                    MEAN_US=$(echo "scale=2; $MEAN_NS / 1000" | bc)
                    echo "| $BENCH_NAME | ✅ OK | ${MEAN_US} µs |" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "| $BENCH_NAME | ✅ OK | ${MEAN_NS} ns |" >> $GITHUB_STEP_SUMMARY
                  fi
                fi
              done
            fi
          fi

          # Add link to full report if available
          if [ -d target/criterion ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📈 Full HTML reports are available in the workflow artifacts." >> $GITHUB_STEP_SUMMARY
          fi

          # Save summary to file for PR comment
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            if [ -f "$GITHUB_STEP_SUMMARY" ]; then
              cp $GITHUB_STEP_SUMMARY benchmark_summary.md || true
            else
              echo "## 📊 Benchmark Results" > benchmark_summary.md
              echo "" >> benchmark_summary.md
              echo "No benchmark results available." >> benchmark_summary.md
            fi
          fi
      - name: Post benchmark results as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: benchmark_summary.md
          edit-mode: replace
